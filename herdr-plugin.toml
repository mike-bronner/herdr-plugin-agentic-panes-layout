id = "mikebronner.agentic-panes-layout"
name = "Agentic Panes Layout"
version = "0.1.1"
min_herdr_version = "0.8.0"
description = "Lay out a newly created worktree workspace: agent, lazygit and a shell in three labelled panes"
platforms = ["macos", "linux"]

[[events]]
on = "worktree.created"
command = ["sh", "bin/on-event"]

[[events]]
on = "worktree.opened"
command = ["sh", "bin/on-event"]
